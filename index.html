<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Directory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem;}
  .search {width: 100%; padding: 0.5rem; font-size: 1rem; margin-bottom: 1rem;}
  table {width: 100%; border-collapse: collapse; margin-top: 1rem;}
  th, td {border: 1px solid #ddd; padding: 0.5rem; text-align: left;}
  th {background:#f2f2f2;}
  .btn {padding: 0.5rem 1rem; cursor: pointer; background:#007bff; color:#fff; border:none; border-radius:4px;}
  .btn:hover {background:#005fcc;}
  .btn-edit {background:#28a745;}
  .btn-edit:hover {background:#1e7e34;}
  .btn-delete {background:#dc3545;}
  .btn-delete:hover {background:#a71d2a;}
  .row-btn {padding: 0.25rem 0.6rem; font-size: 0.85rem; margin-right: 0.25rem;}
  .modal {display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);}
  .modal-content {background:#fff; margin:15% auto; padding:2rem; width:90%; max-width:500px; border-radius:8px; position:relative;}
  .close {position:absolute; right:10px; top:10px; font-size:1.5rem; font-weight:bold; cursor:pointer;}
  #status {margin-left:0.75rem; color:#666; font-size:0.9rem;}
</style>
</head>
<body>

<h2>Patient Directory <span id="status"></span></h2>

<!-- Search bar -->
<input type="text" id="search" class="search" placeholder="Search by name, phone, or registration number...">

<!-- Add Patient button -->
<button class="btn" onclick="openAddModal()">
  Add Patient
</button>

<!-- Patient Modal (add or edit) -->
<div id="patientModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle">Add New Patient</h3>
    <form id="patientForm">
      <input type="hidden" id="editId" value="">
      <input type="text" id="nameInput" placeholder="Name" required style="width:100%; padding:0.5rem; margin-bottom:0.5rem;">
      <input type="tel" id="phoneInput" placeholder="Phone Number" required style="width:100%; padding:0.5rem; margin-bottom:0.5rem;">
      <input type="text" id="regInput" placeholder="Registration Number" required style="width:100%; padding:0.5rem; margin-bottom:1rem;">
      <button type="submit" class="btn" style="width:100%; margin-top:0.5rem;" id="saveBtn">Save Patient</button>
    </form>
  </div>
</div>

<table id="patientTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone Number</th>
      <th>Registration Number</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table>

<script>
  // ---------- SUPABASE ----------
  const SUPABASE_URL = 'https://oqarvapuiiqfjemqubfh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_tbyvTAXpD9ApyZb7ZlMQVQ_z_On_TLt';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let patients = [];

  function setStatus(msg) {
    document.getElementById('status').textContent = msg ? '· ' + msg : '';
  }

  // ---------- LOAD FROM SUPABASE ----------
  async function loadPatients() {
    const { data, error } = await db.from('patients').select('*').order('id');
    if (error) {
      console.error('Load failed:', error);
      setStatus('⚠ load failed: ' + error.message);
      return;
    }
    patients = data || [];
    renderPatients(document.getElementById('search').value);
    setStatus(patients.length + ' patients');
  }

  // ---------- MODAL HELPERS ----------
  function openAddModal() {
    document.getElementById('modalTitle').textContent = 'Add New Patient';
    document.getElementById('saveBtn').textContent = 'Save Patient';
    document.getElementById('editId').value = '';
    document.getElementById('patientForm').reset();
    document.getElementById('patientModal').style.display = 'block';
  }

  function openEditModal(id) {
    const p = patients.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = 'Edit Patient';
    document.getElementById('saveBtn').textContent = 'Update Patient';
    document.getElementById('editId').value = id;
    document.getElementById('nameInput').value = p.name;
    document.getElementById('phoneInput').value = p.phone;
    document.getElementById('regInput').value = p.reg;
    document.getElementById('patientModal').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('patientModal').style.display = 'none';
  }

  // ---------- RENDER ----------
  function renderPatients(filter = '') {
    const tbody = document.querySelector('#patientTable tbody');
    tbody.innerHTML = '';

    const lower = filter.toLowerCase();

    patients.forEach(p => {
      const matches = p.name.toLowerCase().includes(lower) ||
                      p.phone.toLowerCase().includes(lower) ||
                      p.reg.toLowerCase().includes(lower);

      if (matches) {
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td>${p.name}</td><td>${p.phone}</td><td>${p.reg}</td>` +
          `<td>` +
            `<button class="btn btn-edit row-btn" onclick="openEditModal(${p.id})">Edit</button>` +
            `<button class="btn btn-delete row-btn" onclick="deletePatient(${p.id})">Delete</button>` +
          `</td>`;
        tbody.appendChild(tr);
      }
    });
  }

  // ---------- SEARCH ----------
  document.getElementById('search').addEventListener('input', e => {
    renderPatients(e.target.value);
  });

  // ---------- ADD / EDIT PATIENT ----------
  document.getElementById('patientForm').addEventListener('submit', async e => {
    e.preventDefault();

    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const reg = document.getElementById('regInput').value.trim();
    const editId = document.getElementById('editId').value;

    if (!name || !phone || !reg) return;

    const row = { name, phone, reg };

    if (editId) {
      const { error } = await db.from('patients').update(row).eq('id', editId);
      if (error) { setStatus('⚠ update failed: ' + error.message); return; }
      setStatus('updated');
    } else {
      const { error } = await db.from('patients').insert(row);
      if (error) { setStatus('⚠ insert failed: ' + error.message); return; }
      setStatus('saved');
    }

    closeModal();
    await loadPatients();
  });

  // ---------- DELETE PATIENT ----------
  async function deletePatient(id) {
    const p = patients.find(x => x.id === id);
    if (!p) return;
    if (!confirm(`Delete patient "${p.name}"? This cannot be undone.`)) return;

    const { error } = await db.from('patients').delete().eq('id', id);
    if (error) { setStatus('⚠ delete failed: ' + error.message); return; }
    setStatus('deleted');
    await loadPatients();
  }

  // ---------- INITIAL LOAD ----------
  loadPatients();
</script>

</body>
</html>
